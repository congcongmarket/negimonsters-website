<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Original small-batch sofubi characters, made slowly in Shanghai.">
  <title>NEGI MONSTERS Sofubi</title>
  <link rel="icon" href="assets/figma-logo-mark.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="hero-fix.css">
</head>
<body>
  <main id="app" data-lang="en">
    <section class="hero" id="top">
      <header class="nav">
        <a class="brand" href="#top"><img class="brand-mark" src="assets/figma-logo-mark.png" alt=""><b>NEGI MONSTERS</b></a>
        <nav class="navlinks" id="navlinks">
          <a href="#collection" data-copy="nav.0"></a>
          <a href="#story" data-copy="nav.1"></a>
          <button type="button" data-open-order data-copy="nav.2"></button>
        </nav>
        <div class="nav-actions">
          <div class="language-switch" aria-label="Language">
            <button type="button" data-language="en" title="English">EN</button>
            <button type="button" data-language="zh" title="中文">中</button>
            <button type="button" data-language="ja" title="日本語">日</button>
          </div>
          <button class="menu" id="menu" type="button" aria-label="Toggle menu"><span></span><span></span></button>
        </div>
      </header>
      <div class="hero-visual"></div>
      <div class="hero-copy">
        <p class="eyebrow" data-copy="eyebrow"></p>
        <h1><span data-copy="hero.0"></span><br><em data-copy="hero.1"></em></h1>
        <p class="intro" data-copy="intro"></p>
        <a class="primary" href="#collection" data-copy="meet"></a>
      </div>
    </section>

    <section class="collection" id="collection">
      <p class="kicker" data-copy="collectionLabel"></p>
      <div class="collection-intro">
        <h2><span data-copy="collectionTitle.0"></span><br><span data-copy="collectionTitle.1"></span><em data-copy="collectionTitle.2"></em></h2>
        <p data-copy="collectionIntro"></p>
      </div>
      <div class="product-grid" id="product-grid"></div>
    </section>

    <section class="story" id="story">
      <div class="story-number">02</div>
      <div class="story-copy">
        <p class="kicker" data-copy="storyLabel"></p>
        <h2><span data-copy="storyTitle.0"></span><br><span data-copy="storyTitle.1"></span><br><em><span data-copy="storyTitle.2"></span><br><span data-copy="storyTitle.3"></span></em></h2>
        <p data-copy="storyBody.0"></p>
        <p data-copy="storyBody.1"></p>
      </div>
    </section>

    <section class="release">
      <p class="kicker" data-copy="nextRelease"></p>
      <h2><span id="release-name"></span> / <em id="release-subtitle"></em></h2>
      <button class="primary" type="button" data-open-order data-copy="orderButton"></button>
    </section>

    <footer>
      <div class="brand"><img class="brand-mark" src="assets/figma-logo-mark.png" alt=""><b>NEGI MONSTERS</b></div>
      <p><span data-copy="footer.0"></span><br><span data-copy="footer.1"></span></p>
      <div><a href="https://www.instagram.com/negimonsters_toys/" target="_blank" rel="noreferrer">INSTAGRAM ↗</a><a href="mailto:congcongmarkt@gmail.com">EMAIL ↗</a></div>
      <small>© 2026 NEGI MONSTERS</small>
    </footer>
  </main>

  <div class="overlay" id="detail-overlay" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="detail-panel">
      <div class="detail-art" id="detail-art"></div>
      <div class="detail-copy">
        <div class="panel-head"><span id="detail-index"></span><button type="button" data-close-detail></button></div>
        <h2 id="detail-name"></h2>
        <h3 id="detail-subtitle"></h3>
        <p class="character-description" id="detail-description"></p>
        <dl>
          <div><dt data-copy="fields.version"></dt><dd id="detail-version"></dd></div>
          <div><dt data-copy="fields.species"></dt><dd id="detail-species"></dd></div>
        </dl>
      </div>
    </div>
  </div>

  <div class="overlay order-overlay" id="order-overlay" role="dialog" aria-modal="true" aria-hidden="true">
    <aside class="order-panel">
      <div class="panel-head"><span data-copy="nav.2"></span><button type="button" data-close-order></button></div>
      <h2><span data-copy="orderTitle.0"></span><br><span data-copy="orderTitle.1"></span></h2>
      <p data-copy="orderIntro"></p>
      <a class="order-choice instagram" href="https://www.instagram.com/negimonsters_toys/" target="_blank" rel="noreferrer"><span><b data-copy="instagram.0"></b><small data-copy="instagram.1"></small></span><i>↗</i></a>
      <a class="order-choice" href="mailto:congcongmarkt@gmail.com?subject=NEGI%20MONSTERS%20Inquiry"><span><b data-copy="email.0"></b><small data-copy="email.1"></small></span><i>↗</i></a>
    </aside>
  </div>

  <script src="script.js"></script>
</body>
</html>
